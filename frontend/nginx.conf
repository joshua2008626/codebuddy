server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API: the login cookie and Origin check then work without extra CORS setup.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }

  # Single-page app: unknown paths serve index.html so React Router can handle them.
  location / {
    try_files $uri /index.html;
  }
}

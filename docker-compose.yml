# Local/production-like stack: PostgreSQL + API + web.  docker compose up --build
# Judge0 is NOT included: point JUDGE0_URL at your own Judge0 or a hosted one (see .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codebuddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: codebuddy
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codebuddy"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://codebuddy:${POSTGRES_PASSWORD}@db:5432/codebuddy
      TRUST_PROXY: "true"   # nginx sets X-Forwarded-For
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  dbdata:
